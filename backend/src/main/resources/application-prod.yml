spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/note_workbench
    username: note_workbench_user
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
app:
  storage:
    root: /app/storage
  ai:
    chat:
      providers:
        deepseek:
          api-key: ${CHAT_DEEPSEEK_API_KEY}
        dashscope:
          api-key: ${CHAT_DASHSCOPE_API_KEY}
    embedding:
      providers:
        siliconflow:
          api-key: ${EMBEDDING_SILICONFLOW_API_KEY}
        dashscope:
          api-key: ${EMBEDDING_DASHSCOPE_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
