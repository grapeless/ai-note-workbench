services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: note_workbench
      POSTGRES_USER: note_workbench_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 后端会等待数据库真正可用，而不只是等待容器进入运行状态。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    # $$ 将变量留给容器内的 Shell 展开，避免 Compose 提前解析。
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ghcr.io/grapeless/ai-note-workbench-frontend:${FRONTEND_IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    # Nginx 启动时需要通过 Compose 内部 DNS 找到 backend 服务。
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/grapeless/ai-note-workbench-backend:${BACKEND_IMAGE_TAG:-latest}
    environment:
      # 激活 application.yml 与 application-prod.yml。
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      # Compose 服务名同时也是容器内部 DNS 名称。
      CHAT_BASE_URL: "${CHAT_BASE_URL:-}"
      CHAT_API_KEY: "${CHAT_API_KEY:-}"
      CHAT_MODEL: "${CHAT_MODEL:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1024}"
      EMBEDDING_VECTOR_TABLE: "${EMBEDDING_VECTOR_TABLE:-vector_store_siliconflow_bge_m3}"
    # 后端只供 Compose 网络内的前端容器访问，不映射到宿主机端口。
    expose:
      - "8080"
    volumes:
      - backend_storage:/app/storage
    # 完整启动时等待 PostgreSQL 和 Redis 通过健康检查。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

# 命名卷由 Compose 管理；执行 `docker compose down` 不会删除这些数据。只有显式添加 `--volumes` 才会一并删除卷。
volumes:
  postgres_data:
  redis_data:
  backend_storage:
