services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: note_workbench
      POSTGRES_USER: note_workbench_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 后端会等待数据库真正可用，而不只是等待容器进入运行状态。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    # 必须让 redis-server 成为入口脚本的首个参数，Redis 8 才会自动加载 Search、JSON 等内置能力。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG && redis-cli -e --no-auth-warning -a \"$$REDIS_PASSWORD\" FT._LIST >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ccr.ccs.tencentyun.com/ai-note-workbench/note-workbench-frontend:${FRONTEND_IMAGE_TAG:-latest}
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN in .env}"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in .env}"
      BASIC_AUTH_PASSWORD_HASH: "${BASIC_AUTH_PASSWORD_HASH:?Set BASIC_AUTH_PASSWORD_HASH in .env}"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      # Caddy 自动申请的证书和运行配置必须跨容器重建保留。
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Caddy 启动时需要通过 Compose 内部 DNS 找到健康的 backend 服务。
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ccr.ccs.tencentyun.com/ai-note-workbench/note-workbench-backend:${BACKEND_IMAGE_TAG:-latest}
    environment:
      # 激活 application.yml 与 application-prod.yml。
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      # Compose 服务名同时也是容器内部 DNS 名称。
      CHAT_DEEPSEEK_API_KEY: "${CHAT_DEEPSEEK_API_KEY:?Set CHAT_DEEPSEEK_API_KEY in .env}"
      CHAT_DASHSCOPE_API_KEY: "${CHAT_DASHSCOPE_API_KEY:?Set CHAT_DASHSCOPE_API_KEY in .env}"
      EMBEDDING_SILICONFLOW_API_KEY: "${EMBEDDING_SILICONFLOW_API_KEY:?Set EMBEDDING_SILICONFLOW_API_KEY in .env}"
      EMBEDDING_DASHSCOPE_API_KEY: "${EMBEDDING_DASHSCOPE_API_KEY:?Set EMBEDDING_DASHSCOPE_API_KEY in .env}"
    # 后端只供 Compose 网络内的前端容器访问，不映射到宿主机端口。
    expose:
      - "8080"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 完整启动时等待 PostgreSQL 和 Redis 通过健康检查。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

# 命名卷由 Compose 管理；执行 `docker compose down` 不会删除这些数据。只有显式添加 `--volumes` 才会一并删除卷。
volumes:
  postgres_data:
  redis_data:
  backend_storage:
  caddy_data:
  caddy_config:
