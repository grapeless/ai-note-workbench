server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与 Spring Boot 的上传限制保持一致。
    client_max_body_size 5m;

    # 对话接口使用 SSE，关闭代理缓冲才能让消息实时到达浏览器。
    location = /api/chat/doChat {
        proxy_pass http://backend:8080/chat/doChat;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 去掉浏览器请求中的 /api 前缀，再通过 Compose 内部网络访问后端。
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite 会为静态资源生成带内容哈希的文件名，可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不长期缓存，确保发布新版本后能够引用最新资源。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router 的前端路由不存在实体文件时统一返回入口页面。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
